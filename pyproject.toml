[project]
name = "learn-car-insurance-agent"
version = "0.1.0"
description = "学习车险智能体"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "ag-ui-protocol>=0.1.19",
    "fastapi[standard]>=0.135.1",
    "openai>=1.109.0",
    "pydantic-settings>=2.6.0",
    "sqlmodel>=0.0.38",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
